# Local development database. Credentials here are for local use only.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: syndicma
      POSTGRES_PASSWORD: syndicma_dev
      POSTGRES_DB: syndicma
    ports:
      - "55432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syndicma"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  dbdata:
