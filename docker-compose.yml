# Full stack (PostgreSQL + API + web). Secrets come from the environment — nothing is hard-coded:
#   POSTGRES_PASSWORD=... JWT_ACCESS_SECRET=... MFA_ENCRYPTION_KEY=... docker compose up -d --build
#   SUPERADMIN_EMAIL=... SUPERADMIN_PASSWORD=... docker compose run --rm -e SUPERADMIN_EMAIL -e SUPERADMIN_PASSWORD api node dist/create-super-admin.js
# Generate secrets with:  node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: syndicma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: syndicma
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syndicma -d syndicma"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://syndicma:${POSTGRES_PASSWORD}@db:5432/syndicma
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET (>= 32 random chars)}
      # Encrypts the two-factor secrets at rest. Keep it separate from the JWT secret; losing it makes enrolled authenticators unusable.
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?set MFA_ENCRYPTION_KEY (>= 32 random chars)}
      # Refresh cookie is Secure in production (HTTPS only, except localhost). Set to false only for plain-HTTP tests.
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      # Password-reset e-mails (production requires SMTP) and the public URL used in their links
      APP_URL: ${APP_URL:?set APP_URL (public base URL of the web app)}
      MAIL_HOST: ${MAIL_HOST:?set MAIL_HOST (SMTP server)}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Syndic.ma <no-reply@localhost>}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Antivirus for uploads (start the daemon with: docker compose --profile antivirus up -d). Empty = uploads are NOT scanned.
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      # false (default) = if the scanner is down, uploads are refused. true = accept unscanned files (explicit operator choice).
      CLAMAV_FAIL_OPEN: ${CLAMAV_FAIL_OPEN:-false}
    # Migrations are an explicit step executed before the API starts.
    command: ["sh", "-c", "node dist/migrate.js && node dist/main.js"]
    volumes:
      - uploads:/data/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Optional malware scanner. Needs ~1-2 GB RAM and downloads signatures on first start (a few minutes).
  clamav:
    image: clamav/clamav:1.4
    profiles: ["antivirus"]
    volumes:
      - clamdb:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    restart: unless-stopped

  web:
    build: ./frontend
    environment:
      API_UPSTREAM: api:3000
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  dbdata:
  uploads:
  clamdb:
