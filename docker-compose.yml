# Full stack (PostgreSQL + API + web). Secrets come from the environment — nothing is hard-coded:
#   POSTGRES_PASSWORD=... JWT_ACCESS_SECRET=... docker compose up -d --build
#   SUPERADMIN_EMAIL=... SUPERADMIN_PASSWORD=... docker compose run --rm -e SUPERADMIN_EMAIL -e SUPERADMIN_PASSWORD api node dist/create-super-admin.js
# Generate secrets with:  node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: syndicma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: syndicma
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syndicma -d syndicma"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://syndicma:${POSTGRES_PASSWORD}@db:5432/syndicma
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET (>= 32 random chars)}
      # Refresh cookie is Secure in production (HTTPS only, except localhost). Set to false only for plain-HTTP tests.
      COOKIE_SECURE: ${COOKIE_SECURE:-}
    # Migrations are an explicit step executed before the API starts.
    command: ["sh", "-c", "node dist/migrate.js && node dist/main.js"]
    volumes:
      - uploads:/data/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    environment:
      API_UPSTREAM: api:3000
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  dbdata:
  uploads:
