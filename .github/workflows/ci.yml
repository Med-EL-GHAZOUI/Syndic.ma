name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: syndicma
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: syndicma_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U syndicma" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://syndicma:ci_only_password@localhost:5432/syndicma_test
      DATABASE_URL: postgres://syndicma:ci_only_password@localhost:5432/syndicma_test
      JWT_ACCESS_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test
      - name: API tests (e2e, against PostgreSQL)
        shell: bash
        run: |
          set +e
          npm run test:e2e 2>&1 | tee e2e.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # Surface the first failures as an annotation (readable on the run page and through the API without signing in)
            msg=$(awk '/●/{f=1} f' e2e.log | head -60 | sed 's/%/%25/g' | sed ':a;N;$!ba;s///g;s/
/%0A/g')
            [ -z "$msg" ] && msg=$(head -60 e2e.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s///g;s/
/%0A/g')
            echo "::error title=API tests failed::$msg"
          fi
          exit $code
      - name: Dependency audit (production deps)
        run: npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng build --configuration production
      - name: Unit tests (headless Chrome)
        run: npx ng test --watch=false --karma-config=karma.conf.js
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: syndicma
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: syndicma
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U syndicma" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgres://syndicma:ci_only_password@localhost:5432/syndicma
      JWT_ACCESS_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Backend (build + migrate)
        working-directory: backend
        run: |
          npm ci
          npm run build
          npm run migration:run
      - name: Frontend deps
        working-directory: frontend
        run: npm ci
      - name: Browser tests (system Chrome, preinstalled on the runner)
        working-directory: e2e
        run: |
          npm ci
          npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t syndicma-api:ci backend
      - run: docker build -t syndicma-web:ci frontend
