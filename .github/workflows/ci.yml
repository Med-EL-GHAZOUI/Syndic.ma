name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: syndicma
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: syndicma_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U syndicma" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://syndicma:ci_only_password@localhost:5432/syndicma_test
      DATABASE_URL: postgres://syndicma:ci_only_password@localhost:5432/syndicma_test
      JWT_ACCESS_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
      - name: Dependency audit (production deps)
        run: npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng build --configuration production
      - name: Unit tests (headless Chrome)
        run: npx ng test --watch=false --karma-config=karma.conf.js
      - run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t syndicma-api:ci backend
      - run: docker build -t syndicma-web:ci frontend
